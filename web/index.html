<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DISPERSALUD IA — Salud rural inteligente para promotores de Colombia">
  <meta name="keywords" content="salud rural, promotores de salud, Colombia, SIVIGILA, epidemiología">

  <!-- PWA / Mobile -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DISPERSALUD IA">
  <meta name="theme-color" content="#0A5240">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">

  <!-- Favicon e iconos -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>DISPERSALUD IA</title>

  <style id="splash-screen-style">
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background-color: #0A5240;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, #0A5240 0%, #1D9E75 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .splash-logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: pulse 2s infinite;
    }

    .splash-logo img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .splash-title {
      color: white;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .splash-subtitle {
      color: rgba(255,255,255,0.75);
      font-size: 13px;
      letter-spacing: 0.5px;
      margin-bottom: 40px;
    }

    .splash-loader {
      width: 40px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
    }

    .splash-loader-bar {
      height: 100%;
      background: white;
      border-radius: 2px;
      animation: load 1.5s ease-in-out infinite;
    }

    @keyframes load {
      0%   { width: 0%;   margin-left: 0; }
      50%  { width: 80%;  margin-left: 0; }
      100% { width: 0%;   margin-left: 100%; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
      50%       { transform: scale(1.05); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (splash) {
        splash.classList.add("hidden");
        setTimeout(() => splash.remove(), 600);
      }
      document.body.style.background = "transparent";
    }
  </script>
</head>
<body>
  <!-- Splash screen personalizado para web -->
  <div id="splash">
    <div class="splash-logo">
      <img src="assets/assets/logo_dispersalud.png"
           onerror="this.style.display='none'; this.parentElement.innerHTML='💚';"
           alt="DISPERSALUD IA">
    </div>
    <div class="splash-title">DISPERSALUD IA</div>
    <div class="splash-subtitle">Salud rural inteligente · Colombia</div>
    <div class="splash-loader">
      <div class="splash-loader-bar"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async=""></script>
</body>
</html>
